TebLocalPlannerROS:
  # Robot kinematics
  max_vel_x: 0.90
  max_vel_x_backwards: 0.05
  max_vel_theta: 2.84
  acc_lim_x: 0.8
  acc_lim_theta: 3.0

  # Trajectory smoothness
  dt_ref: 0.2
  dt_hysteresis: 0.08
  min_samples: 3
  max_samples: 20
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 2.0
  feasibility_check_no_poses: 2

  # Obstacle avoidance
  min_obstacle_dist: 0.15
  inflation_dist: 0.25
  include_costmap_layer: true
  costmap_obstacles_behind_robot_dist: 0.5
  allow_init_with_backwards_motion: true
  shrink_horizon_backup: true
  shrink_horizon_min_samples: 3

  # Footprint (circular for TurtleBot3 Burger)
  footprint_model:
    type: "circular"
    radius: 0.12

  # Optimization weights
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.04
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 5
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 1
  weight_obstacle: 50
  weight_dynamic_obstacle: 10

  # Disable multi-homotopy (faster, BARN worlds are small)
  enable_homotopy_class_planning: false
  enable_multithreading: true
